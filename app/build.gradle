plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    // Kotlin/Java namespace for R, BuildConfig, and relative class names in
    // the manifest. Independent of applicationId so we can rename the source
    // tree without changing the installed-app identity on user devices.
    namespace 'io.github.wandersalamander.vocabtrainer'
    compileSdk 34

    defaultConfig {
        // Intentionally NOT updated alongside the namespace rename — keeping
        // the original applicationId means existing installs (and their
        // streak/mastery/vocab progress) survive the refactor.
        applicationId "com.example.myapplication"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.getkeepsafe.taptargetview:taptargetview:1.13.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    // Room (SQLite) — replaces SharedPreferences as the source of truth for
    // per-vocab stats, streak state, and daily counters. Repository layer
    // (io.github.wandersalamander.vocabtrainer.data) hides the storage backend so future
    // cloud-sync / Google-Account-backup features can swap implementations
    // without touching call sites. See ADR-001.
    //
    // 2.8.x is the line that ships KSP2 support; earlier versions fail with
    // "unexpected jvm signature V" against Kotlin 2.2.x suspend DAOs.
    implementation 'androidx.room:room-runtime:2.8.2'
    implementation 'androidx.room:room-ktx:2.8.2'
    ksp 'androidx.room:room-compiler:2.8.2'
    // LiteRT-LM SDK — used to load .litertlm model files (Gemma 4 family).
    // We migrated off com.google.mediapipe:tasks-genai because Gemma 4 only
    // ships in the .litertlm format.
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.11.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
