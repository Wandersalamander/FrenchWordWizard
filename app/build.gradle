plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

// Room schema export: writes one JSON per @Database version into
// app/schemas/<AppDatabase>/<version>.json. MigrationTestHelper reads these
// to drive migration tests, and they double as a paper trail of historical
// schema for code review. Commit the generated files alongside any schema bump.
ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

android {
    // Kotlin/Java namespace for R, BuildConfig, and relative class names in
    // the manifest. Independent of applicationId so we can rename the source
    // tree without changing the installed-app identity on user devices.
    namespace 'io.github.wandersalamander.vocabtrainer'
    compileSdk 36

    defaultConfig {
        // The app's permanent Play Store identity (reverse-DNS form; Play does
        // not verify domain ownership, so a site at this domain isn't required).
        // Changed off the original com.example.myapplication — which Play bans —
        // for the first store release. A new applicationId installs as a fresh
        // app with an empty data dir, so it does NOT carry old installs over:
        // users move their progress via Settings → Backup & restore (see
        // ProgressBackup). Independent of `namespace` above, which stays
        // io.github.wandersalamander.vocabtrainer.
        applicationId "com.wandersalamander.vocabtrainer"
        minSdk 26
        targetSdk 36
        versionCode 23
        versionName "20260903.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Bundle native debug symbols (LiteRT-LM .so libs, Room's SQLite)
            // into the .aab so Play can symbolicate native crashes and ANRs.
            // Symbols live in bundle metadata Play strips on upload, so they
            // don't ship to devices or affect installed app size.
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Bundle the exported Room schema JSONs into the androidTest APK so
    // MigrationTestHelper can find them at runtime via the assets folder.
    // Without this, runMigrationsAndValidate throws FileNotFoundException
    // pointing at the missing <DbClass>/<version>.json.
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
}

// Kotlin compiler options. Lives in the top-level kotlin { compilerOptions { } }
// block because the android { kotlinOptions { } } form is deprecated in the
// Kotlin Gradle plugin (2.0+); the typed JvmTarget enum replaces the old
// jvmTarget = '17' string.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.getkeepsafe.taptargetview:taptargetview:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    // Room (SQLite) — replaces SharedPreferences as the source of truth for
    // per-vocab stats, streak state, and daily counters. Repository layer
    // (io.github.wandersalamander.vocabtrainer.data) hides the storage backend so future
    // cloud-sync / Google-Account-backup features can swap implementations
    // without touching call sites. See ADR-001.
    //
    // 2.8.x is the line that ships KSP2 support; earlier versions fail with
    // "unexpected jvm signature V" against Kotlin 2.2.x suspend DAOs.
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    ksp 'androidx.room:room-compiler:2.8.4'
    // LiteRT-LM SDK — used to load .litertlm model files (Gemma 4 family).
    // We migrated off com.google.mediapipe:tasks-genai because Gemma 4 only
    // ships in the .litertlm format.
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.13.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    // MigrationTestHelper for schema-validated migration tests. Reads the
    // JSON schemas exported via the ksp room.schemaLocation arg above.
    androidTestImplementation 'androidx.room:room-testing:2.8.4'
}
